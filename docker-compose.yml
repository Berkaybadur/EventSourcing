services:
  api:
    build:
      context: .
      dockerfile: src/TaskBoard.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://mongo:27017
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - taskboard_mongo:/data/db

volumes:
  taskboard_mongo:
